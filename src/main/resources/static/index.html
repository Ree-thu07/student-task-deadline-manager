<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Organize your tasks, deadlines and priorities</p>
    </header>

    <main>

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

            <div class="card">
                <h3>In Progress</h3>
                <p id="progressTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

        </section>


        <!-- Add Task -->
        <section class="task-form-section">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Task title"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Task description"
                ></textarea>

                <input
                    type="text"
                    id="subject"
                    placeholder="Subject"
                    required
                >

                <label for="deadline">Deadline</label>

                <input
                    type="date"
                    id="deadline"
                    required
                >

                <select id="priority" required>
                    <option value="">Select Priority</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>

                <select id="status" required>
                    <option value="">Select Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>

                <button type="submit">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Task List -->
        <section class="task-list-section">

            <h2>My Tasks</h2>

            <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks by title, subject, priority or status..."
            >
            </div>

            <div id="taskList">
                <!-- Tasks will appear here using JavaScript -->
            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
